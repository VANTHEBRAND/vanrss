name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      DEPLOYMENT_ENVIRONMENT:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
        - preview
        - production
        default: 'preview'

permissions:
  contents: read

jobs:
  deploy:
    if: inputs.DEPLOYMENT_ENVIRONMENT == 'preview' || (inputs.DEPLOYMENT_ENVIRONMENT == 'production' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    environment: ${{ inputs.DEPLOYMENT_ENVIRONMENT }}
    env:
      DEPLOYMENT_ENVIRONMENT: ${{ inputs.DEPLOYMENT_ENVIRONMENT }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install dependencies and build
        run: |
          yarn install --frozen-lockfile --ignore-scripts
          yarn build:production
      - name: Configure deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PAGES_D1_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_OBJECT_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_OBJECT_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BUCKET: ${{ vars.R2_PUBLIC_BUCKET }}
          CF_ACCESS_ISSUER: ${{ vars.CF_ACCESS_ISSUER }}
          CF_ACCESS_AUD: ${{ vars.CF_ACCESS_AUD }}
          PRODUCTION_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          : "${CLOUDFLARE_API_TOKEN:?Missing environment deploy token}" "${CLOUDFLARE_ACCOUNT_ID:?}" "${CLOUDFLARE_PROJECT_NAME:?}"
          : "${R2_ACCESS_KEY_ID:?}" "${R2_SECRET_ACCESS_KEY:?}" "${R2_PUBLIC_BUCKET:?}" "${CF_ACCESS_ISSUER:?}" "${CF_ACCESS_AUD:?}"
          test ! -e .vars.toml
          umask 077
          sh ops/generate_vars_toml.sh
      - name: Deploy
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          node ops/init_project.js
          node ops/init_feed_db.js
          node ops/sync_project_config.js
          node ops/direct_upload.js
      - name: Remove deployment credentials
        if: always()
        run: rm -f .vars.toml
